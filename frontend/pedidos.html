<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Donde Juanca - Pedidos</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

    <div class="app-layout">

        <aside class="sidebar">

            <div class="sidebar-header">
                <h2>Donde Juanca</h2>
            </div>

            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-link">Dashboard</a>
                <a href="mesas.html" class="nav-link">Mesas</a>
                <a href="pedidos.html" class="nav-link active">Pedidos</a>
            </nav>

            <div class="sidebar-user">
                <span id="nombreUsuario">Usuario</span>
                <small>Administrador</small>
            </div>

        </aside>

        <main class="main-content">

            <header class="page-header page-header-actions">
                <div>
                    <h1>Gestión de Pedidos</h1>
                    <p>Consulta y registra pedidos asociados a las mesas.</p>
                </div>

                <button class="btn-primary btn-small" id="btnNuevoPedido">
                    + Nuevo pedido
                </button>
            </header>

            <section class="panel">

                <div class="panel-header">
                    <h2>Pedidos activos</h2>
                </div>

                <div class="table-container">

                    <table>
                        <thead>
                            <tr>
                                <th>Pedido</th>
                                <th>Mesa</th>
                                <th>Personas</th>
                                <th>Total</th>
                                <th>Estado</th>
                            </tr>
                        </thead>

                        <tbody id="pedidosTableBody">
                            <tr>
                                <td>P-2401</td>
                                <td>Mesa 2</td>
                                <td>4</td>
                                <td>$39.000</td>
                                <td>
                                    <span class="status-badge status-active">
                                        Activo
                                    </span>
                                </td>
                            </tr>

                            <tr>
                                <td>P-2402</td>
                                <td>Mesa 3</td>
                                <td>6</td>
                                <td>$138.000</td>
                                <td>
                                    <span class="status-badge status-active">
                                        Activo
                                    </span>
                                </td>
                            </tr>
                        </tbody>
                    </table>

                </div>

            </section>

        </main>

    </div>

    <div class="modal-overlay" id="pedidoModal">

        <div class="modal">

            <div class="modal-header">
                <h2>Nuevo pedido</h2>

                <button class="modal-close" id="cerrarModal">
                    ×
                </button>
            </div>

            <form id="pedidoForm">

                <div class="form-group">
                    <label for="mesaPedido">Mesa</label>

                    <select id="mesaPedido">
                        <option value="">Seleccionar mesa</option>
                        <option value="1">Mesa 1</option>
                        <option value="4">Mesa 4</option>
                        <option value="7">Mesa 7</option>
                        <option value="8">Mesa 8</option>
                        <option value="9">Mesa 9</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="personasPedido">
                        Número de personas
                    </label>

                    <input
                        type="number"
                        id="personasPedido"
                        min="1"
                        max="10"
                        placeholder="Ej. 4"
                    >
                </div>

                <div class="form-group">
                    <label>Categoría</label>

                    <div class="radio-group">

                        <label>
                            <input
                                type="radio"
                                name="categoria"
                                value="Cervezas"
                                checked
                            >
                            Cervezas
                        </label>

                        <label>
                            <input
                                type="radio"
                                name="categoria"
                                value="Licores"
                            >
                            Licores
                        </label>

                        <label>
                            <input
                                type="radio"
                                name="categoria"
                                value="Cocteles"
                            >
                            Cocteles
                        </label>

                    </div>
                </div>

                <div class="form-group">
                    <label>Productos</label>

                    <div class="checkbox-group">

                        <label>
                            <input
                                type="checkbox"
                                name="producto"
                                value="Poker 330ml"
                            >
                            Poker 330ml
                        </label>

                        <label>
                            <input
                                type="checkbox"
                                name="producto"
                                value="Águila 330ml"
                            >
                            Águila 330ml
                        </label>

                        <label>
                            <input
                                type="checkbox"
                                name="producto"
                                value="Club Colombia"
                            >
                            Club Colombia
                        </label>

                    </div>
                </div>

                <p id="pedidoError" class="error-message"></p>

                <div class="modal-actions">
                    <button
                        type="button"
                        class="btn-secondary"
                        id="cancelarPedido"
                    >
                        Cancelar
                    </button>

                    <button
                        type="submit"
                        class="btn-primary"
                    >
                        Crear pedido
                    </button>
                </div>

            </form>

        </div>

    </div>

    <script src="js/app.js"></script>

</body>

</html>
